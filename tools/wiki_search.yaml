identity:
  name: wiki_search
  author: shaba
  label:
    en_US: MediaWiki search
    ru_RU: "MediaWiki: поиск"
description:
  human:
    en_US: Full-text search across the configured MediaWiki site
    ru_RU: Полнотекстовый поиск по настроенному сайту MediaWiki
  llm: Full-text search across the configured MediaWiki wiki. Returns a list of matching pages with title, a short snippet and the page URL. Use to find relevant article titles before reading a page with wiki_get_page.
parameters:
  - name: query
    type: string
    required: true
    label:
      en_US: Query
      ru_RU: Запрос
    human_description:
      en_US: Words or phrase to search for in the wiki
      ru_RU: Слова или фраза для поиска по вики
    llm_description: Free-text search query for the wiki, e.g. a topic, package name, person or concept. Keep it concise; the wiki search matches article text and titles.
    form: llm
  - name: limit
    type: number
    required: false
    default: 5
    label:
      en_US: Limit
      ru_RU: Лимит
    human_description:
      en_US: Maximum number of results (1-50, default 5)
      ru_RU: Максимум результатов (1-50, по умолчанию 5)
    llm_description: Maximum number of search results to return (1-50). Default 5.
    form: form
extra:
  python:
    source: tools/wiki_search.py
